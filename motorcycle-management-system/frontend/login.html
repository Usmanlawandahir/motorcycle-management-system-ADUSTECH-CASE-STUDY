<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ADUSTech Riders</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">🏍️ ADUSTech <span>Riders</span></a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your ADUSTech Riders account</p>
      <div id="alertContainer"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@adustech.edu.ng" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const data = await API.login({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        saveUser(data.user);

        const redirects = {
          user: '/user-dashboard.html',
          rider: '/rider-dashboard.html',
          admin: '/admin-dashboard.html'
        };
        window.location.href = redirects[data.user.role] || '/';
      } catch (err) {
        showAlert(document.getElementById('alertContainer'), err.message);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
